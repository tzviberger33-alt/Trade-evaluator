<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Guillotine Trade Evaluator</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --green: #22c55e; --yellow: #eab308; --red: #ef4444; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
  .container { max-width: 960px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .player-row { display: flex; gap: 8px; margin-bottom: 8px; }
  input, select, button { background: #0b1120; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  input[type="text"] { flex: 2; } input[type="number"] { width: 85px; }
  button { cursor: pointer; background: var(--accent); border: none; font-weight: 600; color: white; }
  button.secondary { background: var(--border); }
  button.danger { background: #7f1d1d; color: #fca5a5; }
  .total-badge { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .total-badge span { color: var(--text); font-size: 17px; font-weight: bold; }
  .verdict-box { background: var(--card); border: 2px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
  .verdict-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
  .verdict-desc { color: var(--muted); font-size: 14px; }
  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #syncStatus { font-size: 12px; color: var(--green); margin-bottom: 12px; }
</style>
</head>
<body>

<div class="container">
  <h1>Live Market Trade Evaluator</h1>
  <div id="syncStatus">Loaded active September league trade market.</div>

  <!-- Quick Market Update Box -->
  <div class="card" style="background: #172033; border-color: var(--accent);">
    <h3 style="margin: 0 0 4px 0; color: var(--accent);">Live Market Updater</h3>
    <p style="font-size: 13px; color: var(--muted); margin: 0 0 8px 0;">Add new players or overwrite prices as your league trades.</p>
    <div class="inline-form">
      <input type="text" id="newPlayerName" placeholder="Player Name" list="playerList">
      <input type="number" id="newPlayerVal" placeholder="FAAB" min="0">
      <button type="button" onclick="saveCustomPlayer()">Update Value</button>
    </div>
    <div id="saveConfirm" style="color: var(--green); font-size: 13px; margin-top: 6px; display: none;">Saved!</div>
  </div>

  <div class="grid">
    <!-- Side A -->
    <div class="card">
      <h3>Team A Assets</h3>
      <div id="sideAPlayers"></div>
      <button type="button" class="secondary" onclick="addPlayerRow('A')">+ Add Player</button>
      <div style="margin-top: 12px;">
        <label>FAAB Included: <input type="number" id="teamA_faab" min="0" value="0" oninput="calculate()"></label>
        <div class="total-badge">Total Package: <span id="teamA_total">0</span></div>
      </div>
    </div>

    <!-- Side B -->
    <div class="card">
      <h3>Team B Assets</h3>
      <div id="sideBPlayers"></div>
      <button type="button" class="secondary" onclick="addPlayerRow('B')">+ Add Player</button>
      <div style="margin-top: 12px;">
        <label>FAAB Included: <input type="number" id="teamB_faab" min="0" value="0" oninput="calculate()"></label>
        <div class="total-badge">Total Package: <span id="teamB_total">0</span></div>
      </div>
    </div>
  </div>

  <div class="card" style="border-color: var(--yellow);">
    <label style="cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; color: var(--yellow);">
      <input type="checkbox" id="brinkCheck" onchange="calculate()">
      Is either team on the Brink (Bottom 3)? 
      <span style="font-weight: normal; font-size: 13px; color: var(--muted);">- Expands allowed gap from 20% to 30%.</span>
    </label>
  </div>

  <div class="verdict-box" id="verdictBox">
    <div class="verdict-title" id="verdictTitle">Enter Assets to Evaluate</div>
    <div class="verdict-desc" id="verdictDesc">Mathematical evaluation pending.</div>
  </div>
</div>

<datalist id="playerList"></datalist>

<script>
// Active market baseline calibrated from your September 1-23 sales
const defaultMarketValues = {
  "Kenneth Walker III": 280,
  "Justin Jefferson": 145,
  "Chase Brown": 140,
  "CeeDee Lamb": 135,
  "De'Von Achane": 135,
  "Javonte Williams": 128,
  "Jahmyr Gibbs": 115,
  "Kyren Williams": 100,
  "Tetairoa McMillan": 82,
  "Tee Higgins": 70,
  "Garrett Wilson": 65,
  "Ladd McConkey": 62,
  "Travis Etienne Jr.": 48,
  "Jaylen Waddle": 46,
  "A.J. Brown": 35,
  "Aaron Jones": 34,
  "DK Metcalf": 32,
  "Courtland Sutton": 30,
  "Rhamondre Stevenson": 27,
  "Jalen Coker": 25,
  "Alec Pierce": 25,
  "Keon Coleman": 20,
  "Jordan Addison": 15,
  "Tyler Allgeier": 14,
  "Denzel Boston": 11,
  "Drake Maye": 10,
  "Kyle Pitts": 8,
  "Jake Ferguson": 7,
  "Dak Prescott": 4,
  "Mark Andrews": 3,
  "Justin Herbert": 2
};

let liveMarketValues = { ...defaultMarketValues };

// Load any local overrides saved from this device
const storedValues = localStorage.getItem('guillotine_live_vals');
if (storedValues) {
  liveMarketValues = { ...liveMarketValues, ...JSON.parse(storedValues) };
}

// Check if external GitHub sync file exists
fetch('market_prices.json')
  .then(res => res.json())
  .then(data => {
    liveMarketValues = { ...liveMarketValues, ...data };
    document.getElementById('syncStatus').textContent = '🟢 Synced with GitHub market_prices.json';
    populateDataList();
  })
  .catch(() => {
    // If no external JSON file, silently runs on default league data
    populateDataList();
  });

function populateDataList() {
  const datalist = document.getElementById('playerList');
  datalist.innerHTML = '';
  Object.keys(liveMarketValues).sort().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    datalist.appendChild(opt);
  });
}

function saveCustomPlayer() {
  const nameInput = document.getElementById('newPlayerName');
  const valInput = document.getElementById('newPlayerVal');
  const name = nameInput.value.trim();
  const val = Number(valInput.value);

  if (!name || isNaN(val)) return;

  liveMarketValues[name] = val;
  localStorage.setItem('guillotine_live_vals', JSON.stringify(liveMarketValues));
  populateDataList();

  const confirm = document.getElementById('saveConfirm');
  confirm.style.display = 'block';
  confirm.textContent = `Saved ${name} at $${val} FAAB!`;
  setTimeout(() => confirm.style.display = 'none', 2500);

  nameInput.value = '';
  valInput.value = '';
  calculate();
}

function addPlayerRow(side) {
  const container = document.getElementById(`side${side}Players`);
  const div = document.createElement('div');
  div.className = 'player-row';
  div.innerHTML = `
    <input type="text" list="playerList" placeholder="Player Name" oninput="onPlayerInput(this, '${side}')">
    <input type="number" placeholder="Val" value="0" min="0" oninput="calculate()">
    <button type="button" class="danger" onclick="this.parentElement.remove(); calculate();">×</button>
  `;
  container.appendChild(div);
}

function onPlayerInput(input, side) {
  const valInput = input.parentElement.querySelector('input[type="number"]');
  if (liveMarketValues[input.value] !== undefined) {
    valInput.value = liveMarketValues[input.value];
  }
  calculate();
}

function calculate() {
  const getSideTotal = (side) => {
    let total = Number(document.getElementById(`team${side}_faab`).value) || 0;
    document.querySelectorAll(`#side${side}Players input[type="number"]`).forEach(i => total += Number(i.value) || 0);
    return total;
  };

  const totalA = getSideTotal('A');
  const totalB = getSideTotal('B');
  document.getElementById('teamA_total').textContent = totalA;
  document.getElementById('teamB_total').textContent = totalB;

  const maxVal = Math.max(totalA, totalB);
  const diff = Math.abs(totalA - totalB);
  const diffPct = maxVal > 0 ? (diff / maxVal) * 100 : 0;
  
  const isBrink = document.getElementById('brinkCheck').checked;
  const vTitle = document.getElementById('verdictTitle');
  const vDesc = document.getElementById('verdictDesc');
  const vBox = document.getElementById('verdictBox');

  if (totalA === 0 && totalB === 0) {
    vTitle.textContent = "Enter Assets to Evaluate";
    vTitle.style.color = "var(--text)";
    vDesc.textContent = "Mathematical evaluation pending.";
    vBox.style.borderColor = "var(--border)";
    return;
  }

  if (diffPct <= 20) {
    vTitle.textContent = "APPROVED — Fair Market Trade";
    vTitle.style.color = "var(--green)";
    vBox.style.borderColor = "var(--green)";
    vDesc.textContent = `Variance is ${diffPct.toFixed(1)}% (Within 20% standard limit).`;
  } else if (diffPct <= 30 && isBrink) {
    vTitle.textContent = "APPROVED — Brink Survival Premium";
    vTitle.style.color = "var(--yellow)";
    vBox.style.borderColor = "var(--yellow)";
    vDesc.textContent = `Variance is ${diffPct.toFixed(1)}% (Allowed under 30% survival zone rule).`;
  } else if (diffPct <= 30 && !isBrink) {
    vTitle.textContent = "REVIEW — Disparity Without Danger";
    vTitle.style.color = "var(--yellow)";
    vBox.style.borderColor = "var(--yellow)";
    vDesc.textContent = `Variance is ${diffPct.toFixed(1)}%. Trade is lopsided; requires team in bottom 3.`;
  } else {
    vTitle.textContent = "WAY OFF — Flag for Veto";
    vTitle.style.color = "var(--red)";
    vBox.style.borderColor = "var(--red)";
    vDesc.textContent = `Variance is ${diffPct.toFixed(1)}%. Exceeds absolute 30% survival threshold.`;
  }
}

populateDataList();
addPlayerRow('A');
addPlayerRow('B');
</script>
</body>
</html>
