<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Guillotine Trade Evaluator</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --green: #22c55e; --yellow: #eab308; --red: #ef4444; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
  .container { max-width: 960px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .player-row { display: flex; gap: 8px; margin-bottom: 8px; }
  input, select, button { background: #0b1120; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  input[type="text"] { flex: 2; } input[type="number"] { width: 85px; }
  button { cursor: pointer; background: var(--accent); border: none; font-weight: 600; color: white; }
  button.secondary { background: var(--border); }
  button.danger { background: #7f1d1d; color: #fca5a5; }
  .total-badge { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .total-badge span { color: var(--text); font-size: 17px; font-weight: bold; }
  .verdict-box { background: var(--card); border: 2px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
  .verdict-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
  .verdict-desc { color: var(--muted); font-size: 14px; }
  #syncStatus { font-size: 12px; color: var(--yellow); margin-bottom: 16px; }
</style>
</head>
<body>

<div class="container">
  <h1>Live Market Trade Evaluator</h1>
  <div id="syncStatus">Attempting to fetch live market values...</div>

  <div class="grid">
    <!-- Side A -->
    <div class="card">
      <h3>Team A Assets</h3>
      <div id="sideAPlayers"></div>
      <button type="button" class="secondary" onclick="addPlayerRow('A')">+ Add Player</button>
      <div style="margin-top: 12px;">
        <label>FAAB Included: <input type="number" id="teamA_faab" min="0" value="0" oninput="calculate()"></label>
        <div class="total-badge">Package Value: <span id="teamA_total">0</span></div>
      </div>
    </div>

    <!-- Side B -->
    <div class="card">
      <h3>Team B Assets</h3>
      <div id="sideBPlayers"></div>
      <button type="button" class="secondary" onclick="addPlayerRow('B')">+ Add Player</button>
      <div style="margin-top: 12px;">
        <label>FAAB Included: <input type="number" id="teamB_faab" min="0" value="0" oninput="calculate()"></label>
        <div class="total-badge">Package Value: <span id="teamB_total">0</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <label style="cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;">
      <input type="checkbox" id="brinkCheck" onchange="calculate()">
      Is either team on the Brink of elimination? (Expands tolerance from 20% to 30%)
    </label>
  </div>

  <div class="verdict-box" id="verdictBox">
    <div class="verdict-title" id="verdictTitle">Enter Assets to Evaluate</div>
    <div class="verdict-desc" id="verdictDesc">Mathematical evaluation pending.</div>
  </div>
</div>

<datalist id="playerList"></datalist>

<script>
let liveMarketValues = {};

// Fetch auto-generated values from GitHub Actions
fetch('market_prices.json')
  .then(response => response.json())
  .then(data => {
    liveMarketValues = data;
    document.getElementById('syncStatus').innerHTML = '🟢 Synced with live market data.';
    populateDataList();
  })
  .catch(err => {
    document.getElementById('syncStatus').innerHTML = '🟡 Operating in manual mode (awaiting server sync).';
  });

function populateDataList() {
  const datalist = document.getElementById('playerList');
  datalist.innerHTML = '';
  Object.keys(liveMarketValues).sort().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    datalist.appendChild(opt);
  });
}

function addPlayerRow(side) {
  const container = document.getElementById(`side${side}Players`);
  const div = document.createElement('div');
  div.className = 'player-row';
  div.innerHTML = `
    <input type="text" list="playerList" placeholder="Player Name" oninput="onPlayerInput(this, '${side}')">
    <input type="number" placeholder="Val" value="0" min="0" oninput="calculate()">
    <button type="button" class="danger" onclick="this.parentElement.remove(); calculate();">×</button>
  `;
  container.appendChild(div);
}

function onPlayerInput(input, side) {
  const valInput = input.parentElement.querySelector('input[type="number"]');
  if (liveMarketValues[input.value]) {
    valInput.value = liveMarketValues[input.value];
  }
  calculate();
}

function calculate() {
  const getSideTotal = (side) => {
    let total = Number(document.getElementById(`team${side}_faab`).value) || 0;
    document.querySelectorAll(`#side${side}Players input[type="number"]`).forEach(i => total += Number(i.value) || 0);
    return total;
  };

  const totalA = getSideTotal('A');
  const totalB = getSideTotal('B');
  document.getElementById('teamA_total').textContent = totalA;
  document.getElementById('teamB_total').textContent = totalB;

  const maxVal = Math.max(totalA, totalB);
  const diff = Math.abs(totalA - totalB);
  const diffPct = maxVal > 0 ? (diff / maxVal) * 100 : 0;
  
  const isBrink = document.getElementById('brinkCheck').checked;
  const vTitle = document.getElementById('verdictTitle');
  const vDesc = document.getElementById('verdictDesc');

  if (totalA === 0 && totalB === 0) return;

  if (diffPct <= 20) {
    vTitle.textContent = "Approved — Within Normal Variance";
    vTitle.style.color = "var(--green)";
    vDesc.textContent = `Variance is ${diffPct.toFixed(1)}% (League limit is 20%). Valid market trade.`;
  } else if (diffPct <= 30 && isBrink) {
    vTitle.textContent = "Approved — Valid Brink Premium";
    vTitle.style.color = "var(--yellow)";
    vDesc.textContent = `Variance is ${diffPct.toFixed(1)}%. Exceeds standard 20%, but allowed under 30% survival rules.`;
  } else if (diffPct <= 30 && !isBrink) {
    vTitle.textContent = "Review Required — Value Disparity";
    vTitle.style.color = "var(--yellow)";
    vDesc.textContent = `Variance is ${diffPct.toFixed(1)}%. Trade is lopsided and requires the Brink toggle to be legal.`;
  } else {
    vTitle.textContent = "Way Off — Flag for Veto";
    vTitle.style.color = "var(--red)";
    vDesc.textContent = `Variance is ${diffPct.toFixed(1)}%. Exceeds absolute maximum 30% survival threshold.`;
  }
}

addPlayerRow('A'); addPlayerRow('B');
</script>
</body>
</html>
